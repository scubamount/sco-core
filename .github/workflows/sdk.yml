name: sdk

# Packages the plugin SDK (sdk/package.py) and builds every example from the zip alone, on
# Linux and on Windows with MSVC; the C# example (cs_hello) is published with NativeAOT on both.
# The csharp-host-sim job loads cs_hello through the real host kit (sco-host-sim). The zip is kept
# as an artifact; nothing is released here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # The C# structs against the pins of tests/abi_*.c, line for line (the zip's copy runs below).
      - name: C# SDK layout test against tests/abi_*.c
        run: dotnet run -c Release --project sdk/csharp/Sco.Sdk.Tests -- tests/abi_v1.c tests/abi_storage.c tests/abi_ui.c tests/abi_settings.c tests/abi_datacore.c tests/abi_game_actors.c tests/abi_game_vehicles.c

      - name: Package the SDK
        run: python3 sdk/package.py --out dist

      - name: Build and check the examples from the zip
        env:
          SCO_SDK_CSHARP: "1"            # cs_hello: NativeAOT linux-x64, checked like the C examples
        run: sdk/test-zip.sh dist/sco-sdk-*.zip

      # The sample DataCore pack, as the zip ships it: sco-dcb lint, and sco-dcb check against the
      # fixture test_datacore_pack writes (the record and field names of 4.10.193 the pack uses).
      # A pack naming a missing field must be refused.
      - name: Check the sample DataCore pack with sco-dcb
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-dcb -DCMAKE_BUILD_TYPE=Release -DSCO_BUILD_TESTS=ON
          cmake --build build-dcb --parallel --target sco-dcb test_datacore_pack
          build-dcb/test_datacore_pack . build-dcb/fixture
          python3 -m zipfile -e dist/sco-sdk-*.zip build-dcb/unpacked
          pack=$(ls -d build-dcb/unpacked/sco-sdk-*/examples/quantum_pack)
          build-dcb/sco-dcb lint "$pack"
          build-dcb/sco-dcb check build-dcb/fixture/quantum_fixture.dcb "$pack"
          if build-dcb/sco-dcb check build-dcb/fixture/quantum_fixture.dcb tests/fixtures/datacore/missing_field; then
            echo "sco-dcb check accepted a pack naming a missing field"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sco-sdk
          path: dist/sco-sdk-*.zip
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # Only the test script comes from the repository; everything it builds comes from the zip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: sdk/test-zip.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sco-sdk
          path: dist

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build and check the examples from the zip (MSVC x64)
        shell: bash
        env:
          SCO_SDK_NO_LUA: "1"            # no Lua on the image; the Linux job runs the Lua example
          SCO_SDK_CSHARP: "1"            # cs_hello: NativeAOT win-x64 with MSVC's linker
          PYTHON: python                 # python3 on Windows can be the Store stub
          CMAKE_GENERATOR_PLATFORM: x64
        run: sdk/test-zip.sh dist/sco-sdk-*.zip

  # cs_hello through the real host kit: sco-host-sim (sco::app, the loader, the runtime) loads the
  # NativeAOT DLL from a plugin root, ticks, invokes cs_hello.wave and unloads. The greeter
  # service is found here (sco-plugin-check can't look services up), so its line is checked too.
  csharp-host-sim:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build sco-host-sim (MSVC x64)
        run: |
          cmake -S . -B build -A x64 -DSCO_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel --target sco-host-sim

      - name: Publish cs_hello (NativeAOT win-x64)
        shell: bash
        run: |
          dotnet publish sdk/examples/cs_hello/cs_hello.csproj -c Release -r win-x64 -o build/cs_publish
          mkdir -p build/sim/cs_hello
          cp build/cs_publish/cs_hello.dll sdk/examples/cs_hello/plugin.ini build/sim/cs_hello/

      - name: Load cs_hello in sco-host-sim and invoke cs_hello.wave
        shell: bash
        run: |
          build/Release/sco-host-sim.exe build/sim --no-lua --ticks 3 --invoke cs_hello.wave "Pilot One" | tee build/sim.txt
          grep -q 'cs_hello.wave -> OK "Hello, Pilot One"' build/sim.txt
          grep -q 'Hello, services' build/sim.txt
          grep -q '^\[sim\] PASS' build/sim.txt
